<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>
     <link rel="stylesheet" href="./style_form.css">
</head>
<body>
    <form id="Meu formulário" action="https://webhook.site/59c7ae70-38bf-45ad-bea0-7af5782cd030" method="post">
        <label for="nome">Nome:</label>
        <input 
        type="text" 
        id="nome" 
        name="nome" 
        placeholder="Digite seu nome" 
        required
        >
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="email@exemplo.com" required><br><br>

        <label for="senha">Senha:</label>
        <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="Digite sua senha" 
            minlength="7"
            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{7,}"
            required
            >
            <br><br>
        
        <label for="idade">Idade:</label>
        <input 
        type="number" 
        id="idade" 
        name="idade" 
        min="13" 
        max="120"
        step="1"
        required
        placeholder="idade"
        >
        <br><br>

        <button type="submit">Enviar</button>


    </form>
</body>
</html>
